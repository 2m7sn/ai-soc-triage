[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-triage"
version = "0.1.0"
description = "Measure rule-based, ML and LLM security-alert triage against labelled ground truth, with log-injection defences for the LLM agent."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abdulmohsen Alharbi"}]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "scikit-learn>=1.3"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
ai-soc-triage = "triage.run:main"

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
